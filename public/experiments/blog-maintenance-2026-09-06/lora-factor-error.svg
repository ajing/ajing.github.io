<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" role="img" aria-labelledby="title desc">
<title id="title">Equivalent LoRA updates can break factor averaging</title>
<desc id="desc">Synthetic 16 by 16 matrices, rank 4, 100 seeds. Median relative Frobenius error: scaling 1: 0 percent, 2: 12.5 percent, 4: 56.25 percent, 8: 153.125 percent, 16: 351.5625 percent, sign flip: 100 percent. Averaging materialized deltas has zero error.</desc>
<rect width="840" height="470" fill="#ffffff"/>
<g font-family="system-ui,sans-serif" fill="#18283b">
<text x="40" y="35" font-size="22" font-weight="700">Same update. Different factors. A broken average.</text>
<text x="40" y="62" font-size="14">Synthetic identity check · 100 seeds · 16 × 16 update, rank 4</text>
<text x="40" y="91" font-size="13">Relative Frobenius error (%) — lower is better</text>
<line x1="80" y1="360.0" x2="810" y2="360.0" stroke="#dce3ea"/>
<text x="68" y="365.0" text-anchor="end" font-size="13">0</text>
<line x1="80" y1="300.0" x2="810" y2="300.0" stroke="#dce3ea"/>
<text x="68" y="305.0" text-anchor="end" font-size="13">100</text>
<line x1="80" y1="240.0" x2="810" y2="240.0" stroke="#dce3ea"/>
<text x="68" y="245.0" text-anchor="end" font-size="13">200</text>
<line x1="80" y1="180.0" x2="810" y2="180.0" stroke="#dce3ea"/>
<text x="68" y="185.0" text-anchor="end" font-size="13">300</text>
<line x1="80" y1="120.0" x2="810" y2="120.0" stroke="#dce3ea"/>
<text x="68" y="125.0" text-anchor="end" font-size="13">400</text>
<rect x="105" y="360.0" width="66" height="1" fill="#b74736" rx="3"/>
<text x="138" y="350.0" text-anchor="middle" font-size="14">0.00%</text>
<circle cx="138" cy="360" r="4" fill="#087e8b"/>
<text x="138" y="385" text-anchor="middle" font-size="13">c = 1</text>
<rect x="223" y="352.5" width="66" height="7.5" fill="#b74736" rx="3"/>
<text x="256" y="342.5" text-anchor="middle" font-size="14">12.50%</text>
<circle cx="256" cy="360" r="4" fill="#087e8b"/>
<text x="256" y="385" text-anchor="middle" font-size="13">c = 2</text>
<rect x="341" y="326.25" width="66" height="33.75" fill="#b74736" rx="3"/>
<text x="374" y="316.25" text-anchor="middle" font-size="14">56.25%</text>
<circle cx="374" cy="360" r="4" fill="#087e8b"/>
<text x="374" y="385" text-anchor="middle" font-size="13">c = 4</text>
<rect x="459" y="268.125" width="66" height="91.875" fill="#b74736" rx="3"/>
<text x="492" y="258.125" text-anchor="middle" font-size="14">153.12%</text>
<circle cx="492" cy="360" r="4" fill="#087e8b"/>
<text x="492" y="385" text-anchor="middle" font-size="13">c = 8</text>
<rect x="577" y="149.0625" width="66" height="210.9375" fill="#b74736" rx="3"/>
<text x="610" y="139.0625" text-anchor="middle" font-size="14">351.56%</text>
<circle cx="610" cy="360" r="4" fill="#087e8b"/>
<text x="610" y="385" text-anchor="middle" font-size="13">c = 16</text>
<rect x="695" y="300.0" width="66" height="60.0" fill="#b74736" rx="3"/>
<text x="728" y="290.0" text-anchor="middle" font-size="14">100.00%</text>
<circle cx="728" cy="360" r="4" fill="#087e8b"/>
<text x="728" y="385" text-anchor="middle" font-size="13">sign flip</text>
<text x="80" y="420" font-size="14" fill="#b74736">■ Average A and B separately</text>
<text x="410" y="420" font-size="14" fill="#087e8b">● Average materialized BA updates: 0%</text>
<text x="80" y="449" font-size="12">Both source adapters implement the same BA. This is not an LLM accuracy experiment.</text>
</g></svg>
